<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            font-family: 'Inter', sans-serif;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        /* --- Ambient Starfield Background --- */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .stars-slow {
            background: rgba(0, 0, 0, 0);
            background-image: 
                radial-gradient(1px 1px at 10px 30px, #fff 100%, transparent),
                radial-gradient(1.5px 1.5px at 50px 100px, #fff 80%, transparent),
                radial-gradient(1px 1px at 150px 200px, #fff 100%, transparent),
                radial-gradient(2px 2px at 300px 80px, #fff 60%, transparent);
            background-size: 400px 400px;
            opacity: 0.15;
            animation: driftParallax 120s linear infinite;
            width: 200%;
            height: 100%;
            position: absolute;
        }

        .stars-fast {
            background: rgba(0, 0, 0, 0);
            background-image: 
                radial-gradient(1.5px 1.5px at 80px 40px, #fff 90%, transparent),
                radial-gradient(1px 1px at 220px 140px, #fff 100%, transparent),
                radial-gradient(2px 2px at 380px 280px, #fff 70%, transparent);
            background-size: 500px 500px;
            opacity: 0.25;
            animation: driftParallax 60s linear infinite;
            width: 200%;
            height: 100%;
            position: absolute;
        }

        @keyframes driftParallax {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* --- Main App Container & Layout --- */
        .app-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            transition: transform 0.1s ease-out;
        }

        /* Thud shake animation trigger class */
        .thud-shake {
            animation: appShake 0.1s ease-in-out 2;
        }

        @keyframes appShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
            100% { transform: translateX(0); }
        }

        /* --- HUD Header Section --- */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .progress-hud {
            position: relative;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-hud svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .progress-hud circle {
            fill: none;
            stroke-width: 6;
        }

        .progress-hud .bg-ring {
            stroke: #38bdf8;
            opacity: 0.15;
        }

        .progress-hud .fill-ring {
            stroke: #34d399;
            stroke-dasharray: 232.4; /* 2 * PI * 37 */
            stroke-dashoffset: 232.4;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text {
            position: absolute;
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
            letter-spacing: 0.05em;
        }

        .hud-titles h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .hud-titles p {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* --- Glassmorphic UI Elements --- */
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 16px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
        }

        /* --- Input Section --- */
        .input-form {
            display: flex;
            gap: 12px;
            width: 100%;
            position: relative;
        }

        .input-container {
            position: relative;
            flex: 1;
        }

        .input-form input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 14px;
            color: #f1f5f9;
            font-family: inherit;
            font-size: 16px; /* Prevents mobile browser zoom */
            outline: none;
            transition: all 0.25s ease;
        }

        .input-form input::placeholder {
            color: #64748b;
        }

        .input-form input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
            background: rgba(30, 41, 59, 0.5);
        }

        /* Add flash utility class */
        .input-flash {
            animation: borderFlash 0.15s ease-out;
        }

        @keyframes borderFlash {
            0% { border-color: rgba(148, 163, 184, 0.12); box-shadow: 0 0 0px transparent; }
            50% { border-color: #ffffff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); }
            100% { border-color: #38bdf8; box-shadow: 0 0 16px rgba(56, 189, 248, 0.2); }
        }

        .btn-add {
            width: 52px;
            height: 52px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }

        .btn-add:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            transform: scale(1.02);
        }

        .btn-add svg {
            width: 20px;
            height: 20px;
            stroke-width: 2.5;
        }

        /* --- Utility & Info Controls --- */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .task-count {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-tabs {
            display: flex;
            background: rgba(30, 41, 59, 0.3);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.08);
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            color: #f1f5f9;
        }

        .filter-btn.active {
            background: rgba(148, 163, 184, 0.15);
            color: #38bdf8;
        }

        /* --- Task List System --- */
        .task-list-container {
            transition: opacity 0.25s ease;
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-card {
            display: flex;
            align-items: center;
            padding: 16px;
            gap: 14px;
            position: relative;
            touch-action: cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: cardEntrance 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform-origin: top center;
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(-20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .task-card.exit-active {
            animation: cardExit 0.3s ease-in forwards !important;
        }

        @keyframes cardExit {
            0% { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(0.9) rotate(-2deg); }
        }

        .task-card:hover {
            border-color: rgba(148, 163, 184, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 6, 23, 0.4);
        }

        /* Drag-and-drop system styling */
        .task-card.dragging {
            opacity: 0.4;
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.2);
            transform: scale(0.98);
        }

        .drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            cursor: grab;
            padding: 2px;
            transition: color 0.2s ease;
        }

        .task-card:hover .drag-handle {
            color: #94a3b8;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        /* Custom SVG Checkbox Design */
        .checkbox-container {
            position: relative;
            width: 24px;
            height: 24px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-container svg {
            width: 100%;
            height: 100%;
        }

        .checkbox-bg {
            fill: none;
            stroke: #475569;
            stroke-width: 2;
            transition: stroke 0.2s ease;
        }

        .task-card:hover .checkbox-bg {
            stroke: #94a3b8;
        }

        .checkbox-circle-fill {
            fill: none;
            stroke: #34d399;
            stroke-width: 2;
            stroke-dasharray: 70;
            stroke-dashoffset: 70;
            transition: stroke-dashoffset 0.25s ease-out;
        }

        .checkbox-check {
            fill: none;
            stroke: #34d399;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            transition: stroke-dashoffset 0.2s ease-out;
        }

        /* Checked State Modifications */
        .task-card.completed .checkbox-circle-fill {
            stroke-dashoffset: 0;
        }

        .task-card.completed .checkbox-check {
            stroke-dashoffset: 0;
            transition-delay: 0.1s;
        }

        .task-card.completed .checkbox-bg {
            stroke: transparent !important;
        }

        .task-text-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .task-text {
            font-size: 16px;
            font-weight: 400;
            color: #f1f5f9;
            transition: color 0.3s ease;
            white-space: pre-wrap;
            word-break: break-word;
            display: inline-block;
            position: relative;
        }

        .task-text::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background: #34d399;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .task-card.completed .task-text {
            color: #64748b;
        }

        .task-card.completed .task-text::after {
            transform: scaleX(1);
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            opacity: 0;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .task-card:hover .btn-delete {
            opacity: 1;
        }

        .btn-delete:hover {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }

        /* --- Footer Controls --- */
        .footer-actions {
            display: flex;
            justify-content: flex-end;
            min-height: 24px;
        }

        .btn-clear {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: color 0.2s ease, opacity 0.2s ease;
            opacity: 0;
            pointer-events: none;
        }

        .btn-clear.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-clear:hover {
            color: #f87171;
        }

        /* --- Empty State Module --- */
        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
            gap: 16px;
            animation: floatingHUD 4s ease-in-out infinite;
        }

        @keyframes floatingHUD {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            color: rgba(56, 189, 248, 0.25);
            border: 1px dashed rgba(148, 163, 184, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .empty-state h3 {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.02em;
        }

        /* --- Interactive Burst System (DOM Particles) --- */
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 9999;
            background: radial-gradient(circle, #34d399 20%, rgba(52, 211, 153, 0) 70%);
        }

        /* --- Responsive Viewport Adaptation --- */
        @media (max-width: 480px) {
            .app-wrapper {
                padding: 24px 12px;
                gap: 18px;
            }
            .task-card {
                padding: 14px 12px;
                border-radius: 12px;
            }
            .btn-delete {
                opacity: 1; /* Always visible on mobile touch systems */
                padding: 10px; /* Enhanced target map */
            }
            .checkbox-container {
                width: 26px;
                height: 26px; /* Enhanced hit area */
            }
        }
    </style>
</head>
<body>

    <div class="starfield">
        <div class="stars-slow"></div>
        <div class="stars-fast"></div>
    </div>

    <main class="app-wrapper" id="appWrapper">
        
        <header>
            <div class="progress-hud">
                <svg>
                    <circle class="bg-ring" cx="45" cy="45" r="37"></circle>
                    <circle class="fill-ring" id="progressRing" cx="45" cy="45" r="37"></circle>
                </svg>
                <div class="progress-text" id="progressPct">0%</div>
            </div>
            <div class="hud-titles">
                <h1>Orbit Tasks</h1>
                <p id="hudDate">SYSTEM INITIALIZING...</p>
            </div>
        </header>

        <form class="input-form" id="todoForm" onsubmit="event.preventDefault();">
            <div class="input-container">
                <input type="text" id="taskInput" placeholder="Launch a new mission..." autocomplete="off" maxlength="120">
            </div>
            <button type="submit" class="btn-add" aria-label="Launch Task" id="addBtn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
            </button>
        </form>

        <div class="controls-row">
            <div class="task-count" id="remainingCount">0 Active Missions</div>
            <div class="filter-tabs">
                <button class="filter-btn active" onclick="setFilter('all')" id="filter-all">All</button>
                <button class="filter-btn" onclick="setFilter('active')" id="filter-active">Active</button>
                <button class="filter-btn" onclick="setFilter('completed')" id="filter-completed">Completed</button>
            </div>
        </div>

        <div class="task-list-container" id="listContainer">
            <ul class="task-list" id="taskList"></ul>
            
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.59 14.37a6 6 0 01-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 006.16-12.12A14.98 14.98 0 009.631 8.41m5.96 5.96a14.926 14.926 0 01-5.841 2.58m-.119-8.54a6 6 0 00-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 00-2.58 5.84m2.6-2.582a15.256 15.256 0 01-2.58 2.58" />
                    </svg>
                </div>
                <h3>All systems nominal. No active missions.</h3>
            </div>
        </div>

        <div class="footer-actions">
            <button class="btn-clear" id="clearCompletedBtn" onclick="clearCompleted()">Clear Completed</button>
        </div>

    </main>

    <script>
        // --- Immutable & Persistent Application State Configuration ---
        const state = {
            tasks: JSON.parse(localStorage.getItem('orbit_tasks_manifest')) || [],
            filter: 'all'
        };

        // Standard Default Mockups on Fresh System Initialization
        const defaultMissions = [
            { id: 'mock-1', text: "Review mission parameters", completed: true, createdAt: Date.now() - 3000 },
            { id: 'mock-2', text: "Calibrate orbital sensors", completed: false, createdAt: Date.now() - 2000 },
            { id: 'mock-3', text: "Deploy communication array", completed: false, createdAt: Date.now() - 1000 }
        ];

        // Seed Default State Frame if Storage Empty
        if (state.tasks.length === 0 && !localStorage.getItem('orbit_tasks_initialized')) {
            state.tasks = [...defaultMissions];
            localStorage.setItem('orbit_tasks_initialized', 'true');
            saveState();
        }

        // --- DOM Elements Cached Nodes ---
        const taskInput = document.getElementById('taskInput');
        const todoForm = document.getElementById('todoForm');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const remainingCount = document.getElementById('remainingCount');
        const clearCompletedBtn = document.getElementById('clearCompletedBtn');
        const progressRing = document.getElementById('progressRing');
        const progressPct = document.getElementById('progressPct');
        const listContainer = document.getElementById('listContainer');
        const appWrapper = document.getElementById('appWrapper');

        // --- Core Utility Event System & Initialization Routine ---
        window.addEventListener('DOMContentLoaded', () => {
            initDateDisplay();
            render();
            
            // Focus Input Keyboard Global Hook ('C' / 'Escape')
            window.addEventListener('keydown', (e) => {
                if (e.key === 'c' || e.key === 'C') {
                    if (document.activeElement !== taskInput) {
                        e.preventDefault();
                        taskInput.focus();
                    }
                }
                if (e.key === 'Escape') {
                    if (document.activeElement === taskInput) {
                        taskInput.value = '';
                        taskInput.blur();
                    }
                }
            });

            // Form Submit Interface Hook
            todoForm.addEventListener('submit', () => {
                const text = taskInput.value.trim();
                if (text) {
                    addTask(text);
                    taskInput.value = '';
                }
            });
        });

        function initDateDisplay() {
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('hudDate').innerText = new Date().toLocaleDateString('en-US', options);
        }

        function saveState() {
            localStorage.setItem('orbit_tasks_manifest', JSON.stringify(state.tasks));
        }

        function generateId() {
            return 'mission_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
        }

        // --- State Modification Core Modules ---
        function addTask(text) {
            const newTask = {
                id: generateId(),
                text: text,
                completed: false,
                createdAt: Date.now()
            };
            state.tasks.unshift(newTask);
            saveState();
            
            // Visual Interaction Response (Flash border/glow feedback system)
            taskInput.classList.add('input-flash');
            setTimeout(() => taskInput.classList.remove('input-flash'), 150);

            render();
        }

        function toggleTask(id, event) {
            const index = state.tasks.findIndex(t => t.id === id);
            if (index !== -1) {
                const updatedState = !state.tasks[index].completed;
                state.tasks[index].completed = updatedState;
                saveState();

                // Trigger Particle burst explosion vectors if task marks completed
                if (updatedState && event) {
                    const rect = event.target.getBoundingClientRect();
                    const targetX = rect.left + (rect.width / 2);
                    const targetY = rect.top + (rect.height / 2);
                    createBurstParticleSystem(targetX, targetY);
                    
                    // Satisfying structural "thud" haptic container vibration simulation
                    appWrapper.classList.add('thud-shake');
                    setTimeout(() => appWrapper.classList.remove('thud-shake'), 100);
                }

                // FLIP positional layout re-rendering adaptation
                render();
            }
        }

        function deleteTask(id, element) {
            const card = element.closest('.task-card');
            card.classList.add('exit-active');
            
            // Wait for structural CSS Exit Animation curves to settle
            card.addEventListener('animationend', () => {
                state.tasks = state.tasks.filter(t => t.id !== id);
                saveState();
                render();
            });
        }

        function clearCompleted() {
            // Apply Batch Exit Class Animations down to active complete DOM items
            const activeCompletedCards = taskList.querySelectorAll('.task-card.completed');
            if (activeCompletedCards.length === 0) return;

            activeCompletedCards.forEach(card => card.classList.add('exit-active'));
            
            // Re-render pipeline execution instantly following first complete structural fade
            setTimeout(() => {
                state.tasks = state.tasks.filter(t => !t.completed);
                saveState();
                render();
            }, 280);
        }

        function setFilter(filterType) {
            if (state.filter === filterType) return;
            
            // Cross-fading structural list view transaction sequence
            listContainer.style.opacity = '0';
            
            setTimeout(() => {
                state.filter = filterType;
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById(`filter-${filterType}`).classList.add('active');
                render();
                listContainer.style.opacity = '1';
            }, 200);
        }

        // --- High Performance Particle Burst Simulation Core ---
        function createBurstParticleSystem(x, y) {
            const count = 12;
            const fragment = document.createDocumentFragment();
            const particlesArray = [];

            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.classList.add('particle');
                
                // Randomized systemic radial trajectory physics allocations
                const angle = Math.random() * Math.PI * 2;
                const distance = 20 + Math.random() * 45;
                const size = 3 + Math.random() * 4;
                
                el.style.width = `${size}px`;
                el.style.height = `${size}px`;
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                
                fragment.appendChild(el);
                
                particlesArray.push({
                    element: el,
                    targetX: Math.cos(angle) * distance,
                    targetY: Math.sin(angle) * distance,
                    duration: 400 + Math.random() * 200,
                    startTime: performance.now()
                });
            }

            document.body.appendChild(fragment);

            // Execute Animation Frame Render Loop Loop Frame
            function updateParticles(timestamp) {
                let active = false;
                
                particlesArray.forEach(p => {
                    const elapsed = timestamp - p.startTime;
                    const progress = Math.min(elapsed / p.duration, 1);
                    
                    if (progress < 1) {
                        active = true;
                        // Cubic ease out pathing implementation matrix
                        const easeOut = 1 - Math.pow(1 - progress, 3);
                        const curX = p.targetX * easeOut;
                        const curY = p.targetY * easeOut;
                        
                        p.element.style.transform = `translate(${curX}px, ${curY}px) scale(${1 - progress})`;
                        p.element.style.opacity = 1 - progress;
                    } else if (p.element.parentNode) {
                        p.element.parentNode.removeChild(p.element);
                    }
                });

                if (active) {
                    requestAnimationFrame(updateParticles);
                }
            }

            requestAnimationFrame(updateParticles);
        }

        // --- Advanced FLIP Structural UI Re-Rendering Engine Pipeline ---
        function render() {
            // Apply filtering logic to active memory tasks state stream
            const filteredTasks = state.tasks.filter(task => {
                if (state.filter === 'active') return !task.completed;
                if (state.filter === 'completed') return task.completed;
                return true;
            });

            // HUD Progress Metrics Data Ring Mathematical Recalculations
            const totalCount = state.tasks.length;
            const completedCount = state.tasks.filter(t => t.completed).length;
            const remainingCountNum = state.tasks.filter(t => !t.completed).length;

            remainingCount.innerText = `${remainingCountNum} Active Mission${remainingCountNum === 1 ? '' : 's'}`;
            
            // HUD Progress Gauge Dynamic Computations
            const percentage = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
            progressPct.innerText = `${percentage}%`;
            
            const radius = 37;
            const circumference = 2 * Math.PI * radius; // Approx 232.47
            const strokeDashoffset = circumference - (percentage / 100) * circumference;
            progressRing.style.strokeDashoffset = strokeDashoffset;

            // Manage System Flush Visibility state
            if (completedCount > 0) {
                clearCompletedBtn.classList.add('visible');
            } else {
                clearCompletedBtn.classList.remove('visible');
            }

            // Reconstruct Manifest Node Pipeline
            if (filteredTasks.length === 0) {
                taskList.innerHTML = '';
                emptyState.style.display = 'flex';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            // Execute DOM Document Fragment generation architecture
            const fragment = document.createDocumentFragment();

            filteredTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-card glass-panel ${task.completed ? 'completed' : ''}`;
                li.setAttribute('data-id', task.id);
                li.setAttribute('draggable', 'true');

                // Custom Modular Template Structural Element Matrix Building
                li.innerHTML = `
                    <div class="drag-handle" title="Drag to reorder">
                        <svg width="14" height="20" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="2" cy="2" r="0.75" fill="currentColor"/>
                            <circle cx="2" cy="6" r="0.75" fill="currentColor"/>
                            <circle cx="2" cy="10" r="0.75" fill="currentColor"/>
                            <circle cx="6" cy="2" r="0.75" fill="currentColor"/>
                            <circle cx="6" cy="6" r="0.75" fill="currentColor"/>
                            <circle cx="6" cy="10" r="0.75" fill="currentColor"/>
                        </svg>
                    </div>
                    <div class="checkbox-container" role="checkbox" aria-checked="${task.completed}">
                        <svg viewBox="0 0 24 24">
                            <circle class="checkbox-bg" cx="12" cy="12" r="10"></circle>
                            <circle class="checkbox-circle-fill" cx="12" cy="12" r="10"></circle>
                            <path class="checkbox-check" d="M20 6L9 17L4 12"></path>
                        </svg>
                    </div>
                    <div class="task-text-wrapper">
                        <span class="task-text">${escapeHTML(task.text)}</span>
                    </div>
                    <button class="btn-delete" aria-label="Abort Mission">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                `;

                // Register Specific Node Functional Interaction Delegates
                li.querySelector('.checkbox-container').addEventListener('click', (e) => toggleTask(task.id, e));
                li.querySelector('.btn-delete').addEventListener('click', (e) => deleteTask(task.id, li));

                // Initialize Drag event listeners instantly on setup
                setupDragAndDropHandlers(li);

                fragment.appendChild(li);
            });

            taskList.innerHTML = '';
            taskList.appendChild(fragment);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // --- Advanced Native Drag & Drop Reordering Implementation ---
        let dragSrcElement = null;

        function setupDragAndDropHandlers(element) {
            // Disable drag systems completely on touch interfaces to block layout scroll collision
            if ('ontouchstart' in window) {
                element.setAttribute('draggable', 'false');
                return;
            }

            element.addEventListener('dragstart', (e) => {
                dragSrcElement = element;
                element.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                // Pass placeholder string to support archaic browser constraints
                e.dataTransfer.setData('text/plain', element.getAttribute('data-id'));
            });

            element.addEventListener('dragend', () => {
                element.classList.remove('dragging');
                document.querySelectorAll('.task-card').forEach(card => card.classList.remove('drag-over'));
                
                // Persist new physical order structural configuration changes
                const updatedTasksOrder = [];
                taskList.querySelectorAll('.task-card').forEach(card => {
                    const id = card.getAttribute('data-id');
                    const taskObj = state.tasks.find(t => t.id === id);
                    if (taskObj) updatedTasksOrder.push(taskObj);
                });
                
                state.tasks = updatedTasksOrder;
                saveState();
            });

            element.addEventListener('dragover', (e) => {
                if (e.preventDefault) e.preventDefault(); 
                return false;
            });

            element.addEventListener('dragenter', (e) => {
                if (element !== dragSrcElement) {
                    const bounding = element.getBoundingClientRect();
                    const offset = e.clientY - bounding.top;
                    if (offset > bounding.height / 2) {
                        element.after(dragSrcElement);
                    } else {
                        element.before(dragSrcElement);
                    }
                }
            });
        }
    </script>
</body>
